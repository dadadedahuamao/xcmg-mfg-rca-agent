services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: xcmg-rca-api
    env_file:
      - ../../.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://rca_user:rca_password@postgres.example.com:5432/xcmg_rca}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-rca}
      BUSINESS_DATABASE_URL: ${BUSINESS_DATABASE_URL:-postgresql://rca_user:rca_password@postgres.example.com:5432/xcmg_rca}
      BUSINESS_DATABASE_SCHEMA: ${BUSINESS_DATABASE_SCHEMA:-public}
      VECTOR_DB_PROVIDER: ${VECTOR_DB_PROVIDER:-pgvector}
      VECTOR_DATABASE_URL: ${VECTOR_DATABASE_URL:-postgresql://rca_user:rca_password@postgres.example.com:5432/xcmg_rca}
      VECTOR_DB_SCHEMA: ${VECTOR_DB_SCHEMA:-rca_vector}
      VECTOR_TABLE_NAME: ${VECTOR_TABLE_NAME:-knowledge_embeddings}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-sk-your-key-here}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://localhost:11434/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-ollama}
      RERANKER_MODEL: ${RERANKER_MODEL:-dengcao/Qwen3-Reranker-4B:Q4_K_M}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-http://localhost:11434}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-ollama}
      RERANKER_TOP_N: ${RERANKER_TOP_N:-5}
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/rca/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
