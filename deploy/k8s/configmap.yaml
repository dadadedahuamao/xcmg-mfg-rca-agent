apiVersion: v1
kind: ConfigMap
metadata:
  name: rca-config
  namespace: xcmg-rca
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  LOG_LEVEL: "INFO"
  DATABASE_SCHEMA: "rca"
  RAG_SOURCE_DIR: "./app/data/knowledge/raw"
  RAG_CHUNKS_DIR: "./app/data/knowledge/chunks"
  RAG_INDEX_MODE: "manual"
  RAG_CHUNK_FILE_PATTERN: "**/*.jsonl"
  RAG_DEACTIVATE_MISSING_CHUNKS: "true"
  RAG_REEMBED_ON_CONTENT_CHANGE: "true"
  RAG_UPDATE_METADATA_ONLY: "true"
  RAG_TOP_K: "5"
  VECTOR_DB_PROVIDER: "pgvector"
  VECTOR_DB_SCHEMA: "rca_vector"
  VECTOR_COLLECTION_NAME: "xcmg_rca_knowledge"
  VECTOR_TABLE_NAME: "knowledge_embeddings"
  LLM_PROVIDER: "openai"
  LLM_MODEL: "gpt-4o-mini"
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "3"
  EMBEDDING_PROVIDER: "openai"
  EMBEDDING_MODEL: "bge-m3"
  EMBEDDING_BASE_URL: "https://api.openai.com/v1"
  EMBEDDING_DIMENSION: "1024"
  EMBEDDING_BATCH_SIZE: "32"
  RERANKER_PROVIDER: "none"
  RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  RERANKER_TOP_N: "5"
  MAX_REFLECTION_ROUNDS: "3"
  CONFIDENCE_THRESHOLD: "0.7"
  REFLECTION_LOW_SCORE_THRESHOLD: "0.4"
  TEXT2SQL_WHITELIST_TABLES: "work_orders,equipment_maintenance,material_inventory,quality_records,interface_logs"
  TEXT2SQL_MAX_LIMIT: "100"
