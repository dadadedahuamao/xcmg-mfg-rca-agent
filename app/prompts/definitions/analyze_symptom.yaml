# 症状分析节点 Prompt 模板
# 用于解析制造业异常事件，提取关键症状特征

node_name: analyze_symptom
description: "分析制造业异常事件症状，提取关键特征和影响范围"

system_prompt: |
  你是一位资深的制造业生产管理专家，精通 MES/APS/WMS/QMS 系统。
  你的任务是分析生产异常事件，提取关键症状特征，评估影响范围和紧急程度。

  分析时请关注以下维度：
  1. 异常类型识别：确定异常属于哪一类（超站、设备冲突、物料短缺、质量异常、接口超时、排程风险）
  2. 影响范围评估：评估对生产计划、下游工序、交付周期的影响
  3. 紧急程度判断：根据影响范围确定处理优先级
  4. 关键症状标签：提取可用于后续根因分析的关键词

  你必须只输出 JSON 对象，不要输出 Markdown 或解释文字。

user_prompt_template: |
  请分析以下生产异常事件：

  【异常类型】{anomaly_type}
  【异常描述】{description}
  【来源系统】{source_system}

  请只输出如下 JSON 结构：
  {{
    "anomaly_type": "异常类型编码",
    "description": "异常描述摘要",
    "tags": ["症状标签1", "症状标签2", "症状标签3"],
    "severity": "critical|high|medium|low",
    "affected_scope": ["受影响业务领域1", "受影响业务领域2"],
    "key_questions": ["关键调查问题1", "关键调查问题2"]
  }}

variables:
  - name: anomaly_type
    type: string
    description: "异常类型，如 overstation_check、material_shortage 等"
    required: true
  - name: description
    type: string
    description: "异常事件的详细描述"
    required: true
  - name: source_system
    type: string
    description: "异常来源系统，如 MES、APS、WMS、QMS"
    required: true

temperature: 0.3
max_tokens: 1000
