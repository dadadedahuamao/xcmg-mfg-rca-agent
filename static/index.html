<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XCMG RCA Agent - 制造业根因分析智能体</title>
<link rel="icon" type="image/png" href="/assest/xcmg.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<!-- ====== BODY_BLOCK ====== -->
<!-- 登录页 -->
<div id="loginView">
  <div class="login-card">
    <div class="login-logo">RCA</div>
    <h1 class="login-title">XCMG RCA Agent</h1>
    <p class="login-subtitle">制造业根因分析智能体</p>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="loginUsername">用户名</label>
        <input class="form-input" type="text" id="loginUsername" placeholder="" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">密码</label>
        <div class="password-field-wrap">
          <input class="form-input password-input" type="password" id="loginPassword" placeholder="" autocomplete="current-password" />
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="显示密码" title="显示密码">
            <svg id="passwordEyeClosed" class="password-eye password-eye-closed" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l18 18"/>
              <path d="M10.6 10.6A2 2 0 0 0 13.4 13.4"/>
              <path d="M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17.4 17.4 0 0 1-2.1 3.1"/>
              <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.1-.9"/>
            </svg>
            <svg id="passwordEyeOpen" class="password-eye password-eye-open hidden" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="loginSubmit">登 录</button>
    </form>
    <div id="loginError" class="login-error hidden"></div>
  </div>
</div>

<!-- 主应用 -->
<div id="appView" class="hidden">
  <!-- 侧边栏 -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-title-row">
      <div class="sidebar-brand">MGF-RAC Agent</div>
      <button type="button" class="icon-btn" id="sidebarToggleInner" title="折叠侧边栏" aria-label="折叠侧边栏">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-nav">
      <button type="button" class="nav-row" id="newChatBtn">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        新聊天
      </button>
      <button type="button" class="nav-row" id="searchChatBtn">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        搜索聊天
      </button>
    </div>
    <div id="sessionsList" class="sessions-list"></div>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar">A</div>
        <div>
          <div class="user-name">admin</div>
          <div class="user-role">管理员</div>
        </div>
      </div>
      <button type="button" class="logout-btn" id="logoutBtn">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        退出登录
      </button>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <header class="topbar">
      <button type="button" class="icon-btn hidden" id="sidebarToggleOuter" title="展开侧边栏" aria-label="展开侧边栏">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="topbar-title" id="topbarTitle"></div>
    </header>

    <div class="messages-wrap" id="messagesWrap">
      <div class="messages" id="messages"></div>
    </div>

    <div class="input-wrap">
      <div class="input-inner">
        <div class="quick-row" id="quickRow"></div>
        <div class="input-row">
          <textarea
            id="inputTextarea"
            class="input-textarea"
            placeholder="描述异常事件，或选择上方快捷类型..."
            rows="1"></textarea>
          <button type="button" class="send-btn" id="sendBtn" title="发送" aria-label="发送">
            <svg id="sendIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
            <svg id="stopIcon" class="hidden" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">Enter 发送，Shift + Enter 换行</div>
      </div>
    </div>
  </main>

  <!-- 搜索聊天模态框 -->
  <div id="searchModal" class="search-modal-overlay hidden" role="dialog" aria-modal="true" aria-label="搜索聊天">
    <div class="search-modal" id="searchModalPanel">
      <div class="search-modal-header">
        <svg class="search-modal-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="modalSearchInput" class="search-modal-input" placeholder="搜索聊天..." autocomplete="off" />
        <button type="button" class="search-modal-close" id="closeSearchModal" title="关闭" aria-label="关闭">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="search-modal-body" id="searchModalResults"></div>
    </div>
  </div>

  <!-- 重命名聊天弹窗 -->
  <div id="renameDialog" class="dialog-overlay hidden" role="dialog" aria-modal="true" aria-label="重命名聊天">
    <div class="rename-dialog">
      <h2 class="dialog-title">重命名聊天</h2>
      <input type="text" id="renameInput" class="dialog-input" maxlength="80" autocomplete="off" />
      <div class="dialog-actions">
        <button type="button" class="dialog-btn" id="renameCancelBtn">取消</button>
        <button type="button" class="dialog-btn danger" id="renameConfirmBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除聊天确认弹窗 -->
  <div id="deleteDialog" class="dialog-overlay hidden" role="dialog" aria-modal="true" aria-label="删除聊天确认">
    <div class="confirm-dialog">
      <h2 class="dialog-title">删除聊天？</h2>
      <p class="dialog-message">这会删除“<strong id="deleteDialogTitle"></strong>”。</p>
      <p class="dialog-subtitle">删除后将无法从左侧历史中恢复。</p>
      <div class="dialog-actions">
        <button type="button" class="dialog-btn" id="deleteCancelBtn">取消</button>
        <button type="button" class="dialog-btn danger" id="deleteConfirmBtn">删除</button>
      </div>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
